org: streams
service: rivo-flow-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: sa-east-1
  memorySize: 128
  stage: ${opt:stage, 'dev'}
  environment: ${file(sls/provider/environment.yml)}
  iam:
    role:
      statements: ${file(sls/provider/iam.yml)}
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - '*'

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  # Node
  createNode: ${file(sls/functions/node.yml):createNode}
  updateNode: ${file(sls/functions/node.yml):updateNode}
  uploadFile: ${file(sls/functions/node.yml):uploadFile}
  confirmUpload: ${file(sls/functions/node.yml):confirmUpload}
  deleteNode: ${file(sls/functions/node.yml):deleteNode}
  createImageAI: ${file(sls/functions/node.yml):createImageAI}
  processImageAI: ${file(sls/functions/node.yml):processImageAI}

  # Flow
  createFlow: ${file(sls/functions/flow.yml):createFlow}
  getFlowById: ${file(sls/functions/flow.yml):getFlowById}

  # Edges
  createEdge: ${file(sls/functions/edges.yml):createEdge}
  deleteEdge: ${file(sls/functions/edges.yml):deleteEdge}

resources:
  Resources:
    MainTable: ${file(sls/resources/dynamo.yml)}
    MainBucket: ${file(sls/resources/s3.yml)}
    ImageQueue: ${file(sls/resources/sqs.yml):ImageQueue}
    DLQImageQueue: ${file(sls/resources/sqs.yml):DLQImageQueue}
    APIGWCustomDomainCertificate: ${file(sls/resources/apigw.yml):APIGWCustomDomainCertificate}
    APIGWCustomDomain: ${file(sls/resources/apigw.yml):APIGWCustomDomain}
    APIGWCustomDomainMapping: ${file(sls/resources/apigw.yml):APIGWCustomDomainMapping}
    APIGWCustomDomainRoute53Record: ${file(sls/resources/apigw.yml):APIGWCustomDomainRoute53Record}
    MainBucketOAC: ${file(sls/resources/cdn.yml):MainBucketOAC}
    MainBucketCDN: ${file(sls/resources/cdn.yml):MainBucketCDN}
    MainBucketCDNPolicy: ${file(sls/resources/cdn.yml):MainBucketCDNPolicy}
    MainBucketCDNCustomDomainRoute53Record: ${file(sls/resources/cdn.yml):MainBucketCDNCustomDomainRoute53Record}