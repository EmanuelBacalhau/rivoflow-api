  org: streams
  service: rivo-flow-api

  provider:
    name: aws
    runtime: nodejs24.x
    architecture: arm64
    region: sa-east-1
    memorySize: 128
    stage: ${opt:stage, 'dev'}
    environment: ${file(sls/provider/environment.yml)}
    iam:
      role:
        statements: ${file(sls/provider/iam.yml)}
    httpApi:
      cors:
        allowedOrigins:
          - http://localhost:3000
        allowedHeaders:
          - Content-Type
          - Authorization
        allowedMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
      authorizers:
        CognitoAuthorizer:
          type: jwt
          identitySource: $request.header.Authorization
          issuerUrl: !GetAtt UserPool.ProviderURL
          audience:
            - !Ref UserPoolClient

  build:
    esbuild:
      configFile: ./esbuild.config.mjs

  functions:
    # Node
    createNode: ${file(sls/functions/nodes.yml):createNode}
    updateNode: ${file(sls/functions/nodes.yml):updateNode}
    uploadFile: ${file(sls/functions/nodes.yml):uploadFile}
    confirmUpload: ${file(sls/functions/nodes.yml):confirmUpload}
    deleteNode: ${file(sls/functions/nodes.yml):deleteNode}
    createImageAI: ${file(sls/functions/nodes.yml):createImageAI}
    processImageAI: ${file(sls/functions/nodes.yml):processImageAI}
    calculateCreditsNodeGenerator: ${file(sls/functions/nodes.yml):calculateCreditsNodeGenerator}

    # Auth
    exchangeCode: ${file(sls/functions/auth.yml):exchangeCode}
    preTokenGenerationTrigger: ${file(sls/functions/auth.yml):preTokenGenerationTrigger}
    postConfirmationTrigger: ${file(sls/functions/auth.yml):postConfirmationTrigger}

    # Flow
    listFlowsByAccount: ${file(sls/functions/flows.yml):listFlowsByAccount}
    createFlow: ${file(sls/functions/flows.yml):createFlow}
    getFlowById: ${file(sls/functions/flows.yml):getFlowById}
    deleteFlow: ${file(sls/functions/flows.yml):deleteFlow}

    # Account
    getMe: ${file(sls/functions/accounts.yml):getMe}

    # Edges
    createEdge: ${file(sls/functions/edges.yml):createEdge}
    deleteEdge: ${file(sls/functions/edges.yml):deleteEdge}

  resources:
    Resources:
      MainTable: ${file(sls/resources/dynamo.yml)}
      MainBucket: ${file(sls/resources/s3.yml)}
      ImageQueue: ${file(sls/resources/sqs.yml):ImageQueue}
      DLQImageQueue: ${file(sls/resources/sqs.yml):DLQImageQueue}
      APIGWCustomDomainCertificate: ${file(sls/resources/apigw.yml):APIGWCustomDomainCertificate}
      APIGWCustomDomain: ${file(sls/resources/apigw.yml):APIGWCustomDomain}
      APIGWCustomDomainMapping: ${file(sls/resources/apigw.yml):APIGWCustomDomainMapping}
      APIGWCustomDomainRoute53Record: ${file(sls/resources/apigw.yml):APIGWCustomDomainRoute53Record}
      MainBucketOAC: ${file(sls/resources/cdn.yml):MainBucketOAC}
      MainBucketCDN: ${file(sls/resources/cdn.yml):MainBucketCDN}
      MainBucketCDNPolicy: ${file(sls/resources/cdn.yml):MainBucketCDNPolicy}
      MainBucketCDNCustomDomainRoute53Record: ${file(sls/resources/cdn.yml):MainBucketCDNCustomDomainRoute53Record}
      UserPool: ${file(sls/resources/cognito.yml):UserPool}
      UserPoolClient: ${file(sls/resources/cognito.yml):UserPoolClient}
      UserPoolDomain: ${file(sls/resources/cognito.yml):UserPoolDomain}
      GoogleIdentityProvider: ${file(sls/resources/cognito.yml):GoogleIdentityProvider}
      # PreTokenGenerationInvokePermission: ${file(sls/resources/cognito.yml):PreTokenGenerationInvokePermission}
      # PostConfirmationInvokePermission: ${file(sls/resources/cognito.yml):PostConfirmationInvokePermission}