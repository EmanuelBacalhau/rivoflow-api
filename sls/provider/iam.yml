# Permissões IAM concedidas à execution role das Lambdas.
# Cada bloco segue o princípio do menor privilégio: apenas as actions
# estritamente necessárias para cada recurso utilizado pela aplicação.

# Acesso ao S3: leitura, escrita e deleção de objetos no bucket de arquivos
- Effect: Allow
  Action:
    - s3:PutObject
    - s3:GetObject
    - s3:DeleteObject
    - s3:DeleteObjects
  Resource: !Sub '${MainBucket.Arn}/*'

# Acesso ao DynamoDB: operações CRUD e batch na tabela principal
- Effect: Allow
  Action:
    - dynamodb:PutItem
    - dynamodb:GetItem
    - dynamodb:UpdateItem
    - dynamodb:DeleteItem
    - dynamodb:Query
    - dynamodb:BatchWriteItem
    - dynamodb:BatchGetItem
    - dybamodb:TransactWriteItems
  Resource: 
   - !GetAtt MainTable.Arn
   - !Sub '${MainTable.Arn}/index/*'

# Acesso ao SQS: envio de mensagens para a fila de geração de imagem
- Effect: Allow
  Action:
    - sqs:SendMessage
  Resource: !GetAtt ImageQueue.Arn
