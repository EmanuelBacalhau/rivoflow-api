listFlowsByAccount:
  handler: src/main/functions/flows/list-flows-by-account.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: GET
        path: /flows

createFlow:
  handler: src/main/functions/flows/create-flow.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: POST
        path: /flows

getFlowById:
  handler: src/main/functions/flows/get-flow-by-id.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: GET
        path: /flows/{flowId}

deleteFlow:
  handler: src/main/functions/flows/delete-flow.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: DELETE
        path: /flows/{flowId}
