createFlow:
  handler: src/main/functions/flows/create-flow.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: POST
        path: /flows

getFlowById:
  handler: src/main/functions/flows/get-flow-by-id.handler
  events:
    - httpApi:
        authorizer:
          name: CognitoAuthorizer
        method: GET
        path: /flows/{flowId}

