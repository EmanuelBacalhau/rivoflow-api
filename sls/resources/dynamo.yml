# Tabela DynamoDB principal da aplicação.
# Usa modelo single-table design com chave composta PK + SK.
# PAY_PER_REQUEST elimina a necessidade de provisionar capacidade.
# PITR habilitado com retenção de 35 dias para recuperação de dados.
Type: AWS::DynamoDB::Table
Properties:
  TableName: ${self:service}-${self:provider.stage}-table
  PointInTimeRecoverySpecification:
    PointInTimeRecoveryEnabled: true
    RecoveryPeriodInDays: 35
  BillingMode: PAY_PER_REQUEST
  AttributeDefinitions:
    - AttributeName: SK
      AttributeType: S
    - AttributeName: PK
      AttributeType: S
  KeySchema:
    - AttributeName: PK
      KeyType: HASH
    - AttributeName: SK
      KeyType: RANGE
