# Certificado TLS emitido pelo ACM para o domínio customizado da API.
# Validação via DNS usando a hosted zone do Route53 (automático pelo CloudFormation).
APIGWCustomDomainCertificate:
  Type: AWS::CertificateManager::Certificate
  Properties:
    DomainName: ${env:API_DOMAIN_NAME}
    ValidationMethod: DNS
    DomainValidationOptions:
      - DomainName: ${env:API_DOMAIN_NAME}
        HostedZoneId: ${env:ROUTE53_HOSTED_ZONE_ID}

# Domínio customizado registrado no API Gateway, associado ao certificado ACM.
# RoutingMode API_MAPPING_ONLY exige que o mapeamento seja feito via ApiMapping.
APIGWCustomDomain:
  Type: AWS::ApiGatewayV2::DomainName
  Properties:
    DomainName: ${env:API_DOMAIN_NAME}
    RoutingMode: API_MAPPING_ONLY
    DomainNameConfigurations:
      - EndpointType: REGIONAL
        IpAddressType: IPV4
        SecurityPolicy: TLS_1_2
        CertificateArn: !Ref APIGWCustomDomainCertificate

# Vincula o domínio customizado ao HTTP API gerado pelo Serverless Framework.
# Stage "$default" é o stage padrão do API Gateway v2.
APIGWCustomDomainMapping:
  Type: AWS::ApiGatewayV2::ApiMapping
  Properties:
    ApiId: !Ref HttpApi
    DomainName: !Ref APIGWCustomDomain
    Stage: $default

# Record A no Route53 apontando o domínio customizado para o endpoint regional do API Gateway.
# Usa Alias Record (sem TTL) para apontar diretamente para o endpoint gerenciado pela AWS.
APIGWCustomDomainRoute53Record:
  Type: AWS::Route53::RecordSet
  Properties:
    HostedZoneId: ${env:ROUTE53_HOSTED_ZONE_ID}
    Name: !Ref APIGWCustomDomain
    Type: A
    AliasTarget:
      DNSName: !GetAtt APIGWCustomDomain.RegionalDomainName
      HostedZoneId: !GetAtt APIGWCustomDomain.RegionalHostedZoneId
