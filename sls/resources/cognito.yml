UserPool:
  Type: AWS::Cognito::UserPool
  Properties:
    UserPoolName: ${self:service}-${self:provider.stage}-userpool
    MfaConfiguration: OFF
    AdminCreateUserConfig:
      AllowAdminCreateUserOnly: true
    UsernameAttributes:
      - email
    Schema:
      - Name: given_name
        AttributeDataType: String
        Required: true
      - Name: family_name
        AttributeDataType: String
        Required: true
    LambdaConfig:
      PreTokenGenerationConfig:
        LambdaVersion: V2_0
        LambdaArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-preTokenGenerationTrigger'
      
PreTokenGenerationInvokePermission:
  Type: AWS::Lambda::Permission
  Properties:
    FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-preTokenGenerationTrigger'
    Action: lambda:InvokeFunction
    Principal: cognito-idp.amazonaws.com
    SourceArn: !GetAtt UserPool.Arn

UserPoolClient:
  DependsOn:
    - UserPool
    - GoogleIdentityProvider
  Type: AWS::Cognito::UserPoolClient
  Properties:
    ClientName: ${self:service}-${self:provider.stage}-userpool-client
    UserPoolId: !Ref UserPool
    GenerateSecret: true
    AllowedOAuthFlowsUserPoolClient: true
    AllowedOAuthFlows:
      - code
    AllowedOAuthScopes:
      - email
      - openid
      - profile
    CallbackURLs:
      - ${env:COGNITO_CALLBACK_URL}
    SupportedIdentityProviders:
      - Google
    TokenValidityUnits:
      AccessToken: hours
    AccessTokenValidity: 1
    RefreshTokenRotation:
      Feature: ENABLED
      RetryGraceperiodSeconds: 0

UserPoolDomain:
  DependsOn:
    - UserPool
  Type: AWS::Cognito::UserPoolDomain
  Properties:
    Domain: rivoflow-${self:provider.stage}
    UserPoolId: !Ref UserPool

GoogleIdentityProvider:
  DependsOn:
    - UserPool
  Type: AWS::Cognito::UserPoolIdentityProvider
  Properties:
    ProviderName: Google
    UserPoolId: !Ref UserPool
    ProviderType: Google
    ProviderDetails:
      authorize_scopes: email openid profile
      client_id: ${env:GOOGLE_CLIENT_ID}
      client_secret: ${env:GOOGLE_CLIENT_SECRET}
    AttributeMapping:
      email: email
      given_name: given_name
      family_name: family_name
      email_verified: email_verified
      picture: picture
