# Filas SQS para processamento assíncrono de geração de imagem via AI.
# Fila principal: recebe as requisições de geração de imagem.
# VisibilityTimeout de 360s alinhado com o timeout da Lambda consumer (300s + margem).
# Long polling (20s) reduz chamadas desnecessárias à fila.
# Após 3 tentativas falhas, a mensagem é movida para a DLQ.
ImageQueue:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:service}-${self:provider.stage}-image-queue
    VisibilityTimeout: 360
    ReceiveMessageWaitTimeSeconds: 20
    RedrivePolicy:
      maxReceiveCount: 3
      deadLetterTargetArn: !GetAtt DLQImageQueue.Arn

# Dead Letter Queue: armazena mensagens que falharam após 3 tentativas.
# Retenção de 14 dias (1.209.600s) para análise e reprocessamento manual.
DLQImageQueue:
  Type: AWS::SQS::Queue
  Properties:
    QueueName: ${self:service}-${self:provider.stage}-image-dlq
    MessageRetentionPeriod: 1209600
